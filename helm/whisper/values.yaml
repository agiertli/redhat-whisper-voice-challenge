# Normally inherited from --namespace; retained as an optional legacy override.
namespace: ""

image:
  repository: quay.io/agiertli/whisper-ui
  tag: "v2.11.1"
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

route:
  enabled: true
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

whisperApi:
  modelName: "whisper"
  displayName: "Whisper large-v3 (Red Hat modelcar)"

conference:
  name: "Red Hat Whisper Voice Challenge"

game:
  # REQUIRED owner decision: e.g. cs for Czechia, sk for Slovakia, en for English.
  requiredLanguage: ""
  challengeCount: "5"
  winThreshold: "4"

difficultyPools: |
  {
    "easy": ["sk", "cs", "en", "pl", "hu", "de", "es", "fr", "hr", "sr", "sl"],
    "medium": ["sk", "cs", "en", "pl", "hu", "de", "es", "fr", "hr", "sr", "sl", "tr", "it", "pt", "nl", "sv", "ro", "uk", "fi", "is", "no"],
    "hard": ["sk", "cs", "en", "pl", "hu", "de", "es", "fr", "hr", "sr", "sl", "bg", "ka", "tr", "it", "pt", "nl", "sv", "ro", "uk", "fi", "is", "no", "ja", "ko", "ar", "zh", "th", "hi"]
  }

languageInfo: |
  {
    "sk": {"flag": "🇸🇰", "name": "Slovak"},
    "cs": {"flag": "🇨🇿", "name": "Czech"},
    "en": {"flag": "🇬🇧", "name": "English"},
    "pl": {"flag": "🇵🇱", "name": "Polish"},
    "hu": {"flag": "🇭🇺", "name": "Hungarian"},
    "de": {"flag": "🇩🇪", "name": "German"},
    "es": {"flag": "🇪🇸", "name": "Spanish"},
    "fi": {"flag": "🇫🇮", "name": "Finnish"},
    "fr": {"flag": "🇫🇷", "name": "French"},
    "hr": {"flag": "🇭🇷", "name": "Croatian"},
    "is": {"flag": "🇮🇸", "name": "Icelandic"},
    "no": {"flag": "🇳🇴", "name": "Norwegian"},
    "sr": {"flag": "🇷🇸", "name": "Serbian"},
    "sl": {"flag": "🇸🇮", "name": "Slovenian"},
    "bg": {"flag": "🇧🇬", "name": "Bulgarian"},
    "ka": {"flag": "🇬🇪", "name": "Georgian"},
    "tr": {"flag": "🇹🇷", "name": "Turkish"},
    "it": {"flag": "🇮🇹", "name": "Italian"},
    "pt": {"flag": "🇵🇹", "name": "Portuguese"},
    "nl": {"flag": "🇳🇱", "name": "Dutch"},
    "sv": {"flag": "🇸🇪", "name": "Swedish"},
    "ro": {"flag": "🇷🇴", "name": "Romanian"},
    "uk": {"flag": "🇺🇦", "name": "Ukrainian"},
    "ja": {"flag": "🇯🇵", "name": "Japanese"},
    "ko": {"flag": "🇰🇷", "name": "Korean"},
    "ar": {"flag": "🇸🇦", "name": "Arabic"},
    "zh": {"flag": "🇨🇳", "name": "Chinese"},
    "th": {"flag": "🇹🇭", "name": "Thai"},
    "hi": {"flag": "🇮🇳", "name": "Hindi"}
  }

dcgmExporterUrl: "http://nvidia-dcgm-exporter.nvidia-gpu-operator.svc:9400/metrics"

thanosQuerier:
  url: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"

gpu:
  memoryUtilization: "0.9"

model:
  # Model weights pulled from Red Hat registry as OCI modelcar image (no S3 needed)
  storageUri: "oci://registry.redhat.io/rhai/modelcar-openai-whisper-large-v3:3.0"
  resources:
    limits:
      cpu: "2"
      memory: 24Gi
      nvidia.com/gpu: "1"
    requests:
      cpu: "2"
      memory: 24Gi
      nvidia.com/gpu: "1"
  nodeSelector:
    node-role.kubernetes.io/gpu-worker: "true"

registration:
  # full: nickname, full name and email; username: one field to join/resume.
  mode: full

tournament:
  storage: "1Gi"
  # Empty: reuse the installed Secret; generate independent credentials on first install.
  # Explicit non-empty values intentionally rotate credentials on upgrade.
  secret: ""
  adminToken: ""
  storageClass: ""  # Empty uses the cluster default; immutable after PVC creation.

vllm:
  image: "registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.4"

# Must be shorter than the Helm timeout. Installer sets this from --timeout.
warmup:
  deadlineSeconds: 1140

# Initialize SQLite once in the master before Gunicorn forks workers.
server:
  gunicornArgs: "--preload"
