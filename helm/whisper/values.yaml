namespace: whisper

image:
  repository: quay.io/agiertli/whisper-ui
  tag: "v2.1.6"
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

route:
  enabled: true
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

# REQUIRED: Set to your cluster's apps domain
# Find it with: oc get ingresses.config cluster -o jsonpath='{.spec.domain}'
clusterDomain: "apps.ocp.68l5q.sandbox2256.opentlc.com"

whisperApi:
  modelName: "whisper"
  displayName: "RedHatAI/whisper-large-v3-turbo-quantized.w4a16"

conference:
  name: "Summit Connect Warsaw"

game:
  requiredLanguage: "pl"
  challengeCount: "5"
  winThreshold: "4"

supportedLanguages: |
  {
    "sk": "Slovenčina",
    "cs": "Čeština",
    "hu": "Magyar",
    "de": "Deutsch",
    "es": "Español",
    "fr": "Français",
    "pl": "Polski",
    "tr": "Türkçe",
    "en": "English",
    "fi": "Suomi",
    "hr": "Hrvatski",
    "is": "Íslenska",
    "no": "Norsk",
    "sr": "Srpski"
  }

dcgmExporterUrl: "http://nvidia-dcgm-exporter.nvidia-gpu-operator.svc:9400/metrics"

thanosQuerier:
  url: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"

gpu:
  memoryUtilization: "0.9"

model:
  # Model weights pulled from Red Hat registry as OCI modelcar image (no S3 needed)
  storageUri: "oci://registry.redhat.io/rhai/modelcar-openai-whisper-large-v3:3.0"
  resources:
    limits:
      cpu: "2"
      memory: 24Gi
      nvidia.com/gpu: "1"
    requests:
      cpu: "2"
      memory: 24Gi
      nvidia.com/gpu: "1"
  nodeSelector:
    node-role.kubernetes.io/gpu-worker: "true"

tournament:
  storage: "1Gi"
  secret: ""       # Auto-generated if empty
  adminToken: ""   # Auto-generated if empty; override with --set tournament.adminToken=xxx

vllm:
  image: "registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:ba060ec145e1b7ac3a3b25b89fc75f7d146746156990ff5858235eaa9d158e32"
