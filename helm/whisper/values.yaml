namespace: whisper

image:
  repository: quay.io/agiertli/whisper-ui
  tag: "v2.1.6"
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

route:
  enabled: true
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

# REQUIRED: Set to your cluster's apps domain
# Find it with: oc get ingresses.config cluster -o jsonpath='{.spec.domain}'
clusterDomain: "apps.ocp.tkrg8.sandbox840.opentlc.com"

whisperApi:
  modelName: "whisper"
  displayName: "RedHatAI/whisper-large-v3-FP8-dynamic"

conference:
  name: "Red Hat Whisper Voice Challenge"

game:
  requiredLanguage: "sk"
  challengeCount: "5"
  winThreshold: "4"

difficultyPools: |
  {
    "easy": ["sk", "cs", "en", "pl", "hu", "de", "es", "fr", "hr", "sr"],
    "medium": ["sk", "cs", "en", "pl", "hu", "de", "es", "fr", "hr", "sr", "tr", "it", "pt", "nl", "sv", "ro", "uk", "fi", "is", "no"],
    "hard": ["sk", "cs", "en", "pl", "hu", "de", "es", "fr", "hr", "sr", "tr", "it", "pt", "nl", "sv", "ro", "uk", "fi", "is", "no", "ja", "ko", "ar", "zh", "th", "hi"]
  }

dcgmExporterUrl: "http://nvidia-dcgm-exporter.nvidia-gpu-operator.svc:9400/metrics"

thanosQuerier:
  url: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"

gpu:
  memoryUtilization: "0.9"

model:
  # Model weights pulled from Red Hat registry as OCI modelcar image (no S3 needed)
  storageUri: "oci://registry.redhat.io/rhai/modelcar-openai-whisper-large-v3:3.0"
  resources:
    limits:
      cpu: "2"
      memory: 24Gi
      nvidia.com/gpu: "1"
    requests:
      cpu: "2"
      memory: 24Gi
      nvidia.com/gpu: "1"
  nodeSelector:
    node-role.kubernetes.io/gpu-worker: "true"

tournament:
  storage: "1Gi"
  secret: "45evZXBDANhH6C7svSfxCc25DZbunqrv"
  adminToken: "ndN1de5DeN5w1gcMNg3GxND4rNQxEYSE"

vllm:
  image: "registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.4"
