name: Installation regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3
      - run: python -m pip install -r requirements-dev.txt
      - run: bash -n deploy.sh scripts/*.sh
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: |
          for script in deploy.sh scripts/*.sh; do
            docker run --rm --network none -i koalaman/shellcheck:v0.10.0 --shell=bash - < "$script"
          done
      - run: helm lint helm/whisper --set game.requiredLanguage=en
      - run: python -m unittest discover -s tests -v
